# SREP Configuration for Acer AN515-54 GTX1650 i7
# This config demonstrates common BIOS patches
# Modify GUID and hex patterns to match YOUR specific BIOS version!
#
# IMPORTANT:
# - Use UEFITool to extract your BIOS and find exact GUID + hex patterns
# - Each machine may have different BIOS versions
# - Start with SIMPLE patches before complex ones
# - LOGGING is ENABLED (suffix _LOG on config filename)
# - Russian output enabled by default (remove _ENG to switch)
#
# For syntax help, see: https://github.com/Maxinator500/SmokelessRuntimeEFIPatcher-RUS
#

# ====== Example 1: Find and Load Setup Module ======
# This searches for the SetupUtility module in RAM
Op Loaded
SetupUtility

# ====== Example 2: Simple Hex Patch by Offset ======
# Replaces 2 bytes at a specific memory offset
# This is the safest method - use offsets from UEFITool
# Uncomment and modify with YOUR values:
#
# Op FastestPatch
# Offset
# 0x1234
# AABB
#

# ====== Example 3: Pattern-based Patch ======
# Finds a hex pattern and replaces it
# Use this when offset varies between BIOS versions
# Uncomment and modify:
#
# Op FastPatch
# Pattern
# FFFFFFFF0000AABBCCDD
# FFFFFFFF0000EEFF0011
#

# ====== Example 4: Regex Pattern Patch ======
# Uses regular expressions for flexible matching
# . matches any byte, [0-9A-F] matches hex classes
# Uncomment and modify:
#
# Op Patch
# Pattern
# FFFF....AABBCCDD
# FFFF0000EEFF0011
#

# ====== Example 5: GPU VBIOS (GTX 1650) ======
# GTX 1650 VBIOS patches require LoadFromFS or GUID loading
# Example structure (replace GUID with actual VBIOS GUID):
#
# Op LoadGUIDandSavePE
# A1B2C3D4-E5F6-1234-5678-9ABCDEF01234
#
# Op FastestPatch
# Offset
# 0x5000
# AABBCCDD
#

# ====== Example 6: Fan Control Unlock ======
# Disables EC firmware fan curve restrictions
# Requires finding EC module GUID first
#
# Op NonamePE
# AAAA0000-BBBB-CCCC-DDDD-EEEEEEEEEEEE
#
# Op FastPatch
# Pattern
# 7500488B
# 9090488B
#

# ====== Example 7: CPU Multiplier Unlock ======
# Modifies BIOS Setup module to unlock CPU multiplier
# WARNING: Only for Intel K-series CPUs (yours is i7, may be locked)
#
# Op FastestPatch
# Offset
# 0x2F00
# 0100
#

# ====== End of Configuration ======
# This must be the last line!
# Uncomment examples above and modify with YOUR BIOS patterns
# Use UEFITool (https://github.com/LongSoft/UEFITool) to extract BIOS first

Op End
